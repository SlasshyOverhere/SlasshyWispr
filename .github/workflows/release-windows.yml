name: Release Windows EXE

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and Release (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) {
            throw "Tag must start with 'v' (example: v0.1.0)."
          }

          $tagVersion = $tag.Substring(1)
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+([\-+].*)?$') {
            throw "Tag must use semantic versioning (example: v1.2.3)."
          }

          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $appVersion = [string]$config.version
          if ($tagVersion -ne $appVersion) {
            throw "Tag version '$tagVersion' does not match src-tauri/tauri.conf.json version '$appVersion'."
          }

      - name: Build Windows NSIS bundle
        run: npm run tauri:build -- --bundles nsis

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SlasshyWispr ${{ github.ref_name }}
          body: Automated release for ${{ github.ref_name }}.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
