name: Release Windows Installer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and Publish Release (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Validate tag matches app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) {
            throw "Tag must start with 'v' (example: v0.1.0)."
          }

          $tagVersion = $tag.Substring(1)
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+([\-+].*)?$') {
            throw "Tag must use semantic versioning (example: v1.2.3)."
          }

          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $appVersion = [string]$config.version
          if ($tagVersion -ne $appVersion) {
            throw "Tag version '$tagVersion' does not match src-tauri/tauri.conf.json version '$appVersion'."
          }

          $cargoToml = Get-Content "src-tauri/Cargo.toml" -Raw
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Could not read version from src-tauri/Cargo.toml."
          }
          $cargoVersion = $Matches[1]
          if ($tagVersion -ne $cargoVersion) {
            throw "Tag version '$tagVersion' does not match src-tauri/Cargo.toml version '$cargoVersion'."
          }

      - name: Build Windows NSIS bundle
        run: npm run tauri:build -- --bundles nsis

      - name: Collect release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null

          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "NSIS installer .exe was not found."
          }

          Copy-Item $installer.FullName "release-assets/$($installer.Name)" -Force
          $sha256 = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "release-assets/checksums.txt" -Value "$sha256  $($installer.Name)" -Encoding UTF8

          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $manifest = @{
            product = "SlasshyWispr"
            version = [string]$config.version
            tag = "${{ github.ref_name }}"
            installer = $installer.Name
            sha256 = $sha256
            releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
            generatedAt = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "release-assets/updater-manifest.json" -Value $manifest -Encoding UTF8

      - name: Generate release notes
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          script: |
            const fs = require("node:fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG_NAME;
            const releaseList = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            const previousRelease = releaseList.find(
              (release) => !release.draft && !release.prerelease && release.tag_name !== tag,
            );
            const previousTag = previousRelease?.tag_name || null;

            let commits = [];
            if (previousTag) {
              const compare = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${previousTag}...${tag}`,
              });
              commits = compare.data.commits || [];
            } else {
              const currentCommit = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: tag,
              });
              commits = [currentCommit.data];
            }

            const categories = [
              { key: "feat", title: "Features" },
              { key: "fix", title: "Fixes" },
              { key: "perf", title: "Performance" },
              { key: "refactor", title: "Refactors" },
              { key: "docs", title: "Documentation" },
              { key: "test", title: "Tests" },
              { key: "ci", title: "CI" },
              { key: "build", title: "Build" },
              { key: "chore", title: "Chores" },
            ];
            const grouped = new Map();
            for (const category of categories) {
              grouped.set(category.title, []);
            }
            grouped.set("Other", []);

            const conventionalCommitRegex = /^([a-zA-Z]+)(?:\([^)]+\))?!?:\s*(.+)$/;
            const hiddenPrefixes = ["chore(release): ship", "chore(release): bump"];

            for (const commit of commits) {
              const sha = commit.sha?.slice(0, 7) || "unknown";
              const rawTitle = (commit.commit?.message || "").split("\n")[0].trim();
              if (!rawTitle) {
                continue;
              }

              const normalizedTitle = rawTitle.toLowerCase();
              if (hiddenPrefixes.some((prefix) => normalizedTitle.startsWith(prefix))) {
                continue;
              }

              const author = commit.author?.login ? ` by @${commit.author.login}` : "";
              const link = commit.html_url || `https://github.com/${owner}/${repo}/commit/${commit.sha}`;
              const line = `- ${rawTitle} ([\`${sha}\`](${link}))${author}`;

              const match = rawTitle.match(conventionalCommitRegex);
              if (!match) {
                grouped.get("Other").push(line);
                continue;
              }

              const typeKey = match[1].toLowerCase();
              const category = categories.find((entry) => entry.key === typeKey);
              if (category) {
                grouped.get(category.title).push(line);
              } else {
                grouped.get("Other").push(line);
              }
            }

            const output = [];
            output.push("## What's Changed");
            output.push("");

            let hasEntries = false;
            for (const category of [...categories.map((entry) => entry.title), "Other"]) {
              const lines = grouped.get(category);
              if (!lines || lines.length === 0) {
                continue;
              }
              hasEntries = true;
              output.push(`### ${category}`);
              output.push(...lines);
              output.push("");
            }

            if (!hasEntries) {
              output.push(`- Release ${tag}`);
              output.push("");
            }

            if (previousTag) {
              output.push(
                `**Full Changelog**: https://github.com/${owner}/${repo}/compare/${previousTag}...${tag}`,
              );
            } else {
              output.push(
                `**Full Changelog**: https://github.com/${owner}/${repo}/commits/${tag}`,
              );
            }

            fs.writeFileSync("release-assets/release-notes.md", `${output.join("\n").trim()}\n`, {
              encoding: "utf8",
            });

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SlasshyWispr ${{ github.ref_name }}
          body_path: release-assets/release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.exe
            release-assets/checksums.txt
            release-assets/updater-manifest.json
