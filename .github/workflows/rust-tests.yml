name: Rust Tests

on:
  push:
    branches: [main, master, beta]
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-tests.yml"
  pull_request:
    branches: [main, master, beta]
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-tests.yml"
  workflow_dispatch:

concurrency:
  group: rust-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust check and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri

    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: cargo check
        run: cargo check

      - name: cargo test
        run: cargo test
