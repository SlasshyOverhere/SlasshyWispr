<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SlasshyWispr Floating Dock</title>
  <style>
    @font-face {
      font-family: 'Geist Mono';
      src: url('fonts/geist-mono/GeistMono-Variable.woff2') format('woff2');
      font-weight: 100 900;
    }

    :root {
      color-scheme: dark;
      --background: #000000;
      --foreground: #ffffff;

      --color-idle: #ffffff;
      --color-active: #ffffff;
      --color-process: #ffffff;
      --color-error: #ff4b4b;

      --primary: #ffffff;
      --primary-glow: rgba(255, 255, 255, 0.18);
      --border-solid: rgba(255, 255, 255, 0.08);
      --accent: #ffffff;
      --text-primary: #ffffff;
      --font-main: "Geist Mono", monospace;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --background: #000000;
      --foreground: #ffffff;
      --color-idle: #ffffff;
      --border-solid: rgba(255, 255, 255, 0.08);
      --accent: #ffffff;
      --text-primary: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
      font-family: var(--font-main);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .dock-shell {
      pointer-events: auto;
      cursor: -webkit-grab;
      cursor: grab;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      user-select: none;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-solid);
      background: #000000;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      transition:
        width 150ms cubic-bezier(0.25, 1, 0.5, 1),
        opacity 120ms ease,
        transform 120ms ease,
        box-shadow 180ms ease;
    }

    .dock-shell:active {
      cursor: -webkit-grabbing;
      cursor: grabbing;
    }

    /* Target all children to inherit cursor, but they will be pointer-events: none */
    .dock-shell *,
    .dock-shell ::before,
    .dock-shell ::after {
      cursor: inherit !important;
    }

    .dock-shell[data-snap="true"] {
      transition:
        width 45ms linear,
        opacity 45ms linear,
        transform 45ms linear,
        box-shadow 60ms linear;
    }

    .dock-shell[data-stage="recording"],
    .dock-shell[data-stage="speaking"] {
      width: 86px;
      justify-content: flex-start;
      padding: 0 10px;
      gap: 6px;
      border-radius: 999px;
      --accent: var(--color-active);
    }

    .dock-shell[data-stage="processing"] {
      width: 44px;
      justify-content: center;
      padding: 0;
      border-radius: 50%;
      --accent: var(--color-process);
    }

    .dock-shell[data-visible="false"] {
      opacity: 0;
      transform: scale(0.92) translateY(10px);
      pointer-events: none;
    }

    .dock-inner-bg {
      position: absolute;
      inset: 2px;
      border-radius: inherit;
      z-index: 2;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.035), transparent 58%),
        #000000;
      pointer-events: none; /* Let clicks pass through to drag region */
    }

    .dock-border-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 180px;
      height: 180px;
      transform: translate(-50%, -50%);
      z-index: 1;
      background: conic-gradient(
        from 0deg,
        transparent 0%,
        rgba(255, 255, 255, 0) 10%,
        rgba(255, 255, 255, 0.6) 50%,
        rgba(255, 255, 255, 1) 90%,
        transparent 100%
      );
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .dock-shell[data-stage="processing"] .dock-border-glow {
      opacity: 1;
      animation: dock-ring-spin 1.5s linear infinite;
    }

    @keyframes dock-ring-spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .mic-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      z-index: 3;
      flex-shrink: 0;
      pointer-events: none; /* Let clicks pass through to drag region */
    }

    .mic-btn {
      width: 100%;
      height: 100%;
      border: 0;
      padding: 0;
      margin: 0;
      border-radius: 50%;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: grab;
      z-index: 3;
      position: relative;
      pointer-events: none; /* Let drag region handle mousedown; clicks routed via dock click handler */
    }

    .mic-icon-hit {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      pointer-events: auto;
      cursor: pointer;
      position: relative;
      z-index: 10;
    }

    .mic-icon-hit:active {
      transform: scale(0.92);
    }

    /* Transparent drag overlay: sits on top of ALL visual elements so
       data-tauri-drag-region hit-test succeeds from any cursor position
       (center, edges, over the SVG, over bars — everywhere).
       IMPORTANT: On transparent windows, WebView2 (Windows) passes hits
       through fully transparent pixels. Using rgba(0,0,0,0.01) makes the
       surface hittable without being visually perceptible. */
    .dock-drag-overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      background: rgba(0, 0, 0, 0.01);
      border-radius: inherit;
      cursor: grab;
    }

    .dock-drag-overlay:active {
      cursor: grabbing;
    }

    .dock-drag-overlay:active {
      cursor: grabbing;
    }

    .dock-logo {
      width: 18px;
      height: 18px;
      display: block;
      pointer-events: none;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.18));
      transition: transform 120ms ease, filter 120ms ease;
      color: var(--foreground);
      transform: translateY(0.5px);
    }

    .dock-shell[data-stage="recording"] .dock-logo,
    .dock-shell[data-stage="speaking"] .dock-logo {
      animation: breathe 2s ease-in-out infinite;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.45));
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .viz-wrap {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      height: 100%;
      position: relative;
      z-index: 3;
      flex-grow: 1;
      min-width: 0;
      pointer-events: none; /* Let clicks pass through to drag region */
    }

    .dock-shell[data-stage="idle"] .viz-wrap,
    .dock-shell[data-stage="processing"] .viz-wrap {
      flex-grow: 0;
      width: 0;
      opacity: 0;
      overflow: hidden;
    }

    .bars, .processing-dots {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      transition: opacity 100ms ease, transform 100ms ease;
      opacity: 0;
      pointer-events: none;
    }

    .dock-shell[data-stage="recording"] .bars,
    .dock-shell[data-stage="speaking"] .bars {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }

    .dock-shell[data-stage="processing"] .processing-dots {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }

    .bars {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 24px;
      transform: translateY(-50%) scale(0.95);
    }

    .bars span {
      width: 3px;
      height: 4px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.4), #ffffff);
      border-radius: 99px;
      transition:
        height 120ms cubic-bezier(0.175, 0.885, 0.32, 1.275),
        background 300ms ease,
        opacity 200ms ease,
        box-shadow 200ms ease;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
      opacity: 0.22;
    }

    .processing-dots {
      display: flex;
      gap: 3px;
      align-items: center;
      transform: translateY(-50%) scale(0.95);
    }

    .processing-dots span {
      width: 4px;
      height: 4px;
      background: #ffffff;
      border-radius: 50%;
      animation: dots 1.2s infinite ease-in-out;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    .processing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .processing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dots {
      0%, 80%, 100% {
        transform: scale(0.6);
        opacity: 0.28;
      }
      40% {
        transform: scale(1.25);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <main
    class="dock-shell"
    id="dock"
    data-stage="idle"
    data-visible="false"
    data-theme="dark"
  >
    <div class="dock-inner-bg"></div>
    <div class="dock-border-glow"></div>

    <!-- Drag overlay: topmost layer covering the entire pill surface.
         data-tauri-drag-region on THIS element ensures Tauri's native
         hit-test finds it no matter where the cursor lands (center,
         edges, over the SVG, over bars — everywhere). The mic-icon-hit
         sits at z-index: 10 above this overlay so clicks still work. -->
    <div class="dock-drag-overlay" data-tauri-drag-region></div>

    <div class="mic-wrap">
      <button class="mic-btn" id="micBtn" type="button" aria-label="Toggle dictation">
        <span class="mic-icon-hit" id="micIconHit">
          <svg
            id="dockLogo"
            class="dock-logo"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="22" />
          </svg>
        </span>
      </button>
    </div>

    <div class="viz-wrap">
      <div id="vizBars" class="bars">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <div id="vizProcessing" class="processing-dots" style="display: none;">
        <span></span><span></span><span></span>
      </div>
    </div>
  </main>

  <script>
    const dock = document.getElementById("dock");
    const micBtn = document.getElementById("micBtn");
    const micIconHit = document.getElementById("micIconHit");
    const vizBars = document.getElementById("vizBars");
    const vizProcessing = document.getElementById("vizProcessing");
    const bars = Array.from(vizBars.querySelectorAll("span"));
    const channel = new BroadcastChannel("slasshywispr-dock");

    let stage = "idle";
    let targetAmplitude = 0;
    let smoothAmplitude = 0;
    let animationFrameId = null;
    let snapTimerId = null;

    function applySnapTransition() {
      dock.dataset.snap = "true";
      if (snapTimerId !== null) {
        clearTimeout(snapTimerId);
      }
      snapTimerId = setTimeout(() => {
        dock.dataset.snap = "false";
        snapTimerId = null;
      }, 120);
    }

    function render(state) {
      if (!state || state.kind !== "state") return;

      const oldStage = stage;
      const wasVisible = dock.dataset.visible === "true";
      stage = state.stage || "idle";
      targetAmplitude = Math.min(Math.max(Number(state.amplitude || 0), 0), 1);
      const nextVisible = state.visible ? "true" : "false";
      const isDictating = stage === "recording" || stage === "speaking";
      const wasDictating = oldStage === "recording" || oldStage === "speaking";

      if (nextVisible === "true" && isDictating && (!wasVisible || !wasDictating)) {
        applySnapTransition();
      }

      dock.dataset.visible = nextVisible;
      dock.dataset.stage = stage;

      const theme = state.theme === "light" ? "light" : "dark";
      dock.dataset.theme = theme;
      document.documentElement.setAttribute("data-theme", theme);
    }

    function animate(now) {
      const active = stage === "recording" || stage === "speaking";

      if (dock.dataset.visible === "false") {
        animationFrameId = requestAnimationFrame(animate);
        return;
      }

      smoothAmplitude += (targetAmplitude - smoothAmplitude) * 0.15;
      
      // Ensure a minimum "breathing" amplitude when active so bars aren't static
      const displayAmp = active ? Math.max(smoothAmplitude, 0.08) : smoothAmplitude;

      bars.forEach((bar, i) => {
        const offset = i * 0.6;
        const wave = active ? (Math.sin(now * 0.007 + offset) * 0.4 + 0.6) : 0.05;
        const minH = 4;
        const maxH = 24;
        const height = active
          ? (minH + displayAmp * (maxH - minH) * wave)
          : minH;

        bar.style.height = `${height}px`;
        bar.style.opacity = active ? (0.35 + wave * 0.65) : 0.12;
        bar.style.boxShadow = active
          ? `0 0 ${height / 2}px rgba(255,255,255,0.45)`
          : "none";
      });

      animationFrameId = requestAnimationFrame(animate);
    }

    // Only the small icon hit area triggers mic toggle
    micIconHit.addEventListener("click", (e) => {
      e.stopPropagation();
      channel.postMessage({ kind: "action", action: "toggle-mic" });
    });

    // Clicking anywhere else on the dock (not on the mic icon) opens the app
    dock.addEventListener("click", (e) => {
      if (micIconHit.contains(e.target)) return;
      channel.postMessage({ kind: "action", action: "open-app" });
    });

    channel.onmessage = (event) => render(event.data);
    animationFrameId = requestAnimationFrame(animate);
  </script>
</body>
</html>
