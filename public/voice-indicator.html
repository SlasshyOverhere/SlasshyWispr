<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SlasshyWispr Floating Dock</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap");

      :root {
        color-scheme: dark;
        --background: 240 10% 4%;
        --foreground: 0 0% 98%;
        --primary: 235 86% 65%;
        --border: 240 6% 14%;
        --bg-glass: hsla(240, 10%, 4%, 0.7);
        --border-glass: hsla(240, 6%, 14%, 0.8);
        --accent: hsl(var(--primary));
        --text-primary: hsl(var(--foreground));
        --text-secondary: hsl(240, 5%, 65%);
        --font-main: "Inter", system-ui, -apple-system, sans-serif;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --background: 0 0% 100%;
        --foreground: 240 10% 3.9%;
        --primary: 235 86% 65%;
        --border: 240 5.9% 90%;
        --bg-glass: hsla(0, 0%, 100%, 0.8);
        --border-glass: hsla(240, 5.9%, 90%, 0.8);
        --accent: hsl(var(--primary));
        --text-primary: hsl(var(--foreground));
        --text-secondary: hsl(240, 3.8%, 46.1%);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: var(--font-main);
      }

      .dock-shell {
        width: 100%;
        height: 100%;
        border-radius: 999px;
        border: 1px solid var(--border-glass);
        background: var(--bg-glass);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px 0 8px;
        user-select: none;
        transition: opacity 200ms ease, transform 200ms ease;
      }

      .dock-shell[data-visible="false"] {
        opacity: 0;
        transform: scale(0.95);
        pointer-events: none;
      }

      .mic-btn {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 50%;
        color: white;
        background: var(--accent);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: transform 150ms ease, box-shadow 150ms ease;
        flex-shrink: 0;
      }

      .mic-btn:hover {
        transform: scale(1.05);
        filter: brightness(1.1);
      }

      .dock-shell[data-stage="recording"] .mic-btn {
        animation: pulse-recording 1.5s infinite;
      }

      @keyframes pulse-recording {
        0% { box-shadow: 0 0 0 0 rgba(122, 122, 255, 0.7); }
        70% { box-shadow: 0 0 0 10px rgba(122, 122, 255, 0); }
        100% { box-shadow: 0 0 0 0 rgba(122, 122, 255, 0); }
      }

      .viz-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 24px;
        position: relative;
      }

      .bars {
        display: flex;
        align-items: center;
        gap: 3px;
        height: 100%;
      }

      .bars span {
        width: 3px;
        height: 4px;
        background: var(--accent);
        border-radius: 2px;
        transition: height 100ms ease;
      }

      .status-text {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .processing-dots {
        display: flex;
        gap: 4px;
      }

      .processing-dots span {
        width: 4px;
        height: 4px;
        background: var(--text-secondary);
        border-radius: 50%;
        animation: dots 1s infinite ease-in-out;
      }

      .processing-dots span:nth-child(2) { animation-delay: 0.2s; }
      .processing-dots span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes dots {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </head>
  <body>
    <main class="dock-shell" id="dock" data-stage="idle" data-visual="idle" data-visible="false" data-theme="dark" data-tauri-drag-region>
      <button class="mic-btn" id="micBtn" type="button" aria-label="Toggle dictation">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </button>

      <div class="viz-wrap" data-tauri-drag-region>
        <div id="vizBars" class="bars">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div id="vizProcessing" class="processing-dots" style="display: none;">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="status-text" id="statusText" data-tauri-drag-region>Ready</div>
    </main>

    <script>
      const dock = document.getElementById("dock");
      const micBtn = document.getElementById("micBtn");
      const statusText = document.getElementById("statusText");
      const vizBars = document.getElementById("vizBars");
      const vizProcessing = document.getElementById("vizProcessing");
      const bars = Array.from(vizBars.querySelectorAll("span"));
      const channel = new BroadcastChannel("slasshywispr-dock");

      let stage = "idle";
      let targetAmplitude = 0;
      let smoothAmplitude = 0;

      function render(state) {
        if (!state || state.kind !== "state") return;

        stage = state.stage || "idle";
        targetAmplitude = Math.min(Math.max(Number(state.amplitude || 0), 0), 1);

        dock.dataset.visible = state.visible ? "true" : "false";
        dock.dataset.stage = stage;
        const theme = state.theme === "light" ? "light" : "dark";
        dock.dataset.theme = theme;
        document.documentElement.setAttribute("data-theme", theme);

        if (stage === "recording" || stage === "speaking") {
          vizBars.style.display = "flex";
          vizProcessing.style.display = "none";
        } else if (stage === "processing") {
          vizBars.style.display = "none";
          vizProcessing.style.display = "flex";
        } else {
          vizBars.style.display = "flex";
          vizProcessing.style.display = "none";
        }

        statusText.textContent = stage.charAt(0).toUpperCase() + stage.slice(1);
        if (stage === "idle") statusText.textContent = "Ready";
      }

      function animate(now) {
        smoothAmplitude += (targetAmplitude - smoothAmplitude) * 0.2;
        const active = stage === "recording" || stage === "speaking";
        
        bars.forEach((bar, i) => {
          const wobble = active ? (Math.sin(now * 0.01 + i) * 0.2 + 0.8) : 0.1;
          const height = active ? (4 + smoothAmplitude * 16 * wobble) : 4;
          bar.style.height = `${height}px`;
          bar.style.opacity = active ? 1 : 0.3;
        });

        requestAnimationFrame(animate);
      }

      micBtn.addEventListener("click", () => {
        channel.postMessage({ kind: "action", action: "toggle-mic" });
      });

      channel.onmessage = (event) => render(event.data);
      requestAnimationFrame(animate);
    </script>
  </body>
</html>
