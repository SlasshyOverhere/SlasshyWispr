<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selection Assistant</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap");

      :root {
        color-scheme: dark;
        --background: 240 10% 4%;
        --foreground: 0 0% 98%;
        --primary: 235 86% 65%;
        --border: 240 6% 14%;
        --card: 240 6% 7%;
        
        --bg-surface: hsl(var(--card));
        --border-subtle: hsl(var(--border));
        --accent: hsl(var(--primary));
        --text-primary: hsl(var(--foreground));
        --text-secondary: hsl(240, 5%, 65%);
        --font-main: "Inter", system-ui, -apple-system, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: var(--font-main);
        color: var(--text-primary);
      }

      .surface {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 12px;
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      #resultText {
        margin: 0;
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.6;
        font-size: 14px;
        color: var(--text-primary);
      }

      .actions {
        padding: 12px;
        background: rgba(0, 0, 0, 0.2);
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        border-top: 1px solid var(--border-subtle);
      }

      button {
        background: var(--accent);
        color: white;
        border: 0;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 150ms ease;
      }

      button:hover {
        filter: brightness(1.1);
        transform: translateY(-1px);
      }

      button.secondary {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text-primary);
      }

      button.secondary:hover {
        background: rgba(255, 255, 255, 0.15);
      }
    </style>
  </head>
  <body>
    <main class="surface" data-tauri-drag-region>
      <div style="position: absolute; top: 12px; left: 16px; opacity: 0.5; pointer-events: none;">
        <img src="logo.png" alt="" style="width: 16px; height: 16px; object-fit: contain;" />
      </div>
      <div id="resultText"></div>
      <div class="actions">
        <button type="button" id="copyBtn">Copy</button>
        <button type="button" id="replaceBtn" hidden>Replace</button>
        <button type="button" id="closeBtn" class="secondary">Close</button>
      </div>
    </main>

    <script>
      const resultText = document.getElementById("resultText");
      const copyBtn = document.getElementById("copyBtn");
      const replaceBtn = document.getElementById("replaceBtn");
      const closeBtn = document.getElementById("closeBtn");
      const channel = new BroadcastChannel("slasshywispr-selection-popup");

      let latestToken = 0;
      let activeVoice = null;

      async function playVoice(base64) {
        if (!base64) return;
        try {
          if (activeVoice) activeVoice.pause();
          activeVoice = new Audio(`data:audio/wav;base64,${base64}`);
          await activeVoice.play();
        } catch {}
      }

      function render(payload) {
        if (!payload) return;
        const token = Number(payload.token || 0);
        if (token && token < latestToken) return;
        if (token) latestToken = token;

        resultText.textContent = payload.text || "";
        replaceBtn.hidden = payload.mode !== "rewrite";
        if (payload.audioBase64) void playVoice(payload.audioBase64);
      }

      copyBtn.addEventListener("click", () => channel.postMessage({ kind: "action", action: "copy-result" }));
      replaceBtn.addEventListener("click", () => channel.postMessage({ kind: "action", action: "replace-selection" }));
      closeBtn.addEventListener("click", () => channel.postMessage({ kind: "action", action: "close-popup" }));

      channel.onmessage = (event) => {
        if (event.data.kind === "clear") {
          resultText.textContent = "";
          replaceBtn.hidden = true;
          if (activeVoice) activeVoice.pause();
        } else if (event.data.kind === "payload") {
          render(event.data.payload);
        }
      };

      channel.postMessage({ kind: "action", action: "request-state" });
    </script>
  </body>
</html>
