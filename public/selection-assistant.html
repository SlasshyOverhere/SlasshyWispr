<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selection Assistant</title>
    <style>
      @font-face {
        font-family: 'Geist Mono';
        src: url('fonts/geist-mono/GeistMono-Variable.woff2') format('woff2');
        font-weight: 100 900;
      }

      :root {
        color-scheme: dark;
        /* Warm charcoal — same family as the app shell. Amber is
           reserved for the live/primary action only. */
        --bg-surface: oklch(0.19 0.005 60);
        --border-subtle: oklch(0.29 0.004 60);
        --border-strong: oklch(0.38 0.004 60);
        --accent: oklch(0.72 0.19 55);
        --accent-ink: oklch(0.11 0.006 60);
        --text-primary: oklch(0.96 0.006 70);
        --text-secondary: oklch(0.74 0.008 70);
        --text-muted: oklch(0.58 0.006 70);
        --font-main: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: var(--font-main);
        color: var(--text-primary);
      }

      .surface {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 12px;
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        box-shadow:
          0 12px 32px oklch(0.05 0.006 60 / 0.55),
          inset 0 1px 0 oklch(0.96 0.006 70 / 0.04);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      #resultText {
        margin: 0;
        flex: 1;
        overflow-y: auto;
        padding: 16px 16px 12px;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.6;
        font-size: 14px;
        color: var(--text-primary);
      }

      .actions {
        padding: 10px 12px;
        background: oklch(0.16 0.005 60);
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        border-top: 1px solid var(--border-subtle);
        flex-shrink: 0;
      }

      button {
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid var(--border-subtle);
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
      }

      button:hover {
        background: oklch(0.25 0.005 60);
        border-color: var(--border-strong);
        color: var(--text-primary);
      }

      /* Primary: Copy / Replace — amber, the live action. */
      button.primary {
        background: var(--accent);
        border-color: transparent;
        color: var(--accent-ink);
      }

      button.primary:hover {
        background: oklch(0.76 0.19 55);
        color: var(--accent-ink);
      }

      button.primary:active {
        background: oklch(0.66 0.19 55);
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="surface" data-tauri-drag-region>
      <div id="resultText"></div>
      <div class="actions">
        <button type="button" id="copyBtn" class="primary">Copy</button>
        <button type="button" id="replaceBtn" class="primary" hidden>Replace</button>
        <button type="button" id="closeBtn">Close</button>
      </div>
    </main>

    <script>
      const resultText = document.getElementById("resultText");
      const copyBtn = document.getElementById("copyBtn");
      const replaceBtn = document.getElementById("replaceBtn");
      const closeBtn = document.getElementById("closeBtn");
      const channel = new BroadcastChannel("slasshywispr-selection-popup");

      let latestToken = 0;
      let activeVoice = null;

      async function playVoice(base64) {
        if (!base64) return;
        try {
          if (activeVoice) activeVoice.pause();
          activeVoice = new Audio(`data:audio/wav;base64,${base64}`);
          await activeVoice.play();
        } catch {}
      }

      function render(payload) {
        if (!payload) return;
        const token = Number(payload.token || 0);
        if (token && token < latestToken) return;
        if (token) latestToken = token;

        resultText.textContent = payload.text || "";
        replaceBtn.hidden = payload.mode !== "rewrite";
        if (payload.audioBase64) void playVoice(payload.audioBase64);
      }

      copyBtn.addEventListener("click", () => channel.postMessage({ kind: "action", action: "copy-result" }));
      replaceBtn.addEventListener("click", () => channel.postMessage({ kind: "action", action: "replace-selection" }));
      closeBtn.addEventListener("click", () => channel.postMessage({ kind: "action", action: "close-popup" }));

      channel.onmessage = (event) => {
        if (event.data.kind === "clear") {
          resultText.textContent = "";
          replaceBtn.hidden = true;
          if (activeVoice) activeVoice.pause();
        } else if (event.data.kind === "payload") {
          render(event.data.payload);
        }
      };

      channel.postMessage({ kind: "action", action: "request-state" });
    </script>
  </body>
</html>
